<div class="dialog-container custom-dialog">
  <div class="dialog-header">
    <h2>Create Task</h2>
    <button class="close-btn" (click)="close()">✖</button>
  </div>
  <form (ngSubmit)="submit()" #form="ngForm" class="task-form">
    <label for="title" class="required">Title</label>
    <input
      type="text"
      id="title"
      name="title"
      [(ngModel)]="title"
      required
      #titleInput="ngModel"
    />
    <div
      class="error"
      *ngIf="titleInput.invalid && (titleInput.dirty || titleInput.touched)"
    >
      Title is required.
    </div>

    <label for="description">Description</label>
    <input
      type="text"
      id="description"
      name="description"
      [(ngModel)]="description"
    />

    <label for="status">Status</label>
    <select id="status" name="status" [(ngModel)]="status">
      <option>To Do</option>
      <option>In Progress</option>
      <option>Done</option>
    </select>

    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid" class="primary">
        Add
      </button>
      <button type="button" (click)="close()">Cancel</button>
    </div>
  </form>
</div>
